<!doctype html>
<!--
COMMAND CENTER v1 — single file (fonts embedded), no build step, no server needed.
Open by double-clicking this file (file://), or serve it as a static site (GitHub Pages). It is self-contained.

STORAGE: one adapter object (`adapter` in the script) with load() -> state|null and save(state) -> bool. Optional GitHub sync wraps it (see "GitHub sync" section and SYNC.md): localStorage stays the offline cache.
v1 uses localStorage key "cc.command-center.v1". To use a GitHub repo or Drive file instead, replace that one object.

JSON SHAPE (what "Export JSON" writes and what the adapter stores; every row has the ROW fields):
ROW fields (items, bots, lanes, outbox, notes):
  id:string, owner:"cosmo", visibility:"personal"|"team", created_at:ISO, updated_at:ISO
{
  "format": "command-center/v1",
  "meta":     { "version":1, "sample":true|false, "owner":"cosmo", "updated_at":ISO },   // sample:true => EXAMPLE DATA badge
  "settings": { "theme":"dark"|"light" },
  "lanes": [ { ROW, "name", "color":"#hex(dark)", "color_light":"#hex", "shape":"circle|square|triangle|diamond|hexagon|pentagon|octagon",
               "mark":{ "type":"shape"|"emoji"|"letter", "value":"" }, "order":0, "desc":"" } ],
  "priorities": { "lane_order":[laneId,...],                                     // top = wins ties; drives Auto top 3
                  "rules":[ { "key":"blocked"|"dated"|"waiting", "title","desc","enabled":true,"days":3|7|null } ] },
  "bots": [ { ROW, "name","source_name","lane":laneId|null,"color","color_light","label":"CoS","job",
              "last_activity_at":ISO|null,"last_note","reports_to":[...],"hidden":false,"compact":false,"inline":true,
              "more_sample":0, "snapshot":[ { "status","text","date","link","item_id":itemId|null } ] } ],
  "items": [ { ROW, "title","lane":laneId,"kind":"task"|"decision",
               "status":"open|in_process|scheduled|blocked|deadline|waiting|waiting_you|done|discarded|note",
               "due":"YYYY-MM-DD"|null, "bot":botId|null, "note", "link":{ "lane":laneId,"item_id":itemId|null,"label":null }|null,
               "pinned":false,"pinned_at":ISO|null,"since":"YYYY-MM-DD"|null,"done_at":ISO|null,"inbox":false,"sample":false } ],
  "outbox": [ { ROW, "to_bot":botId,"to_bot_name","lane":laneId|null,"text","status":"pending"|"sent","sent_at":ISO|null } ],
  "notes":  [ { ROW, "title","url","text","lane":laneId|null,"sample":false } ]
}
RULES: lanes are never merged. Counts are per lane only. Cross-lane "link" is a reference chip, not a shared row.
Test hooks: window.CC.state / CC.exportJSON() / CC.importText(json,true). Add ?today=YYYY-MM-DD to the URL to pin "today".
-->

--red-t:#8C2F1F;--red-b:#FBEAE6;--purple-t:#654D86;--purple-b:#F2EDF9;--gray-t:#5F6660;--gray-b:#E8E9E4;

*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:'Atkinson Hyperlegible',sans-serif;font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
body{overflow:hidden}
.mono{font-family:'IBM Plex Mono',monospace;font-feature-settings:'zero' 1}
.disp{font-family:'Fraunces',serif;font-weight:560}
.kick{font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--sage)}
.muted{color:var(--muted)}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.s{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
.evoke{background:var(--d-evoke)}.evolve{background:var(--d-evolve)}.equil{background:var(--d-equil)}.broad{background:var(--d-broad)}.home{background:var(--d-home)}
.pl{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:color-mix(in srgb,var(--pc,var(--muted)) var(--ptmix),var(--ink))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;white-space:nowrap}
.chip.blue{color:var(--blue-t);background:var(--blue-b)}.chip.green{color:var(--green-t);background:var(--green-b)}
.chip.amber{color:var(--amber-t);background:var(--amber-b)}.chip.red{color:var(--red-t);background:var(--red-b)}
.chip.purple{color:var(--purple-t);background:var(--purple-b)}.chip.gray{color:var(--gray-t);background:var(--gray-b)}
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:10px;padding:8px 14px;font:700 13px 'Atkinson Hyperlegible';border:1px solid var(--line);background:transparent;color:var(--ink);white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:9px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--panel)}
.seg span{padding:5px 14px;border-radius:7px;font-weight:700;font-size:12.5px;color:var(--muted)}
.seg span.on{background:var(--accent);color:var(--on-accent)}
.badge{border:1px dashed var(--amber-t);color:var(--amber-t);border-radius:8px;padding:3px 9px;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;line-height:1.25;text-align:center}
.legend{display:flex;gap:16px;font-size:11px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.lg-green{background:var(--green-t)}.lg-red{background:var(--red-t)}.lg-blue{background:var(--blue-t)}.lg-purple{background:var(--purple-t)}.lg-amber{background:var(--amber-t)}.lg-gray{background:var(--gray-t)}

/* ---- project identity: shape mark + left stripe + soft tint (folded from today-color-v3 overrides; no :has()) ---- */
.p-evoke{--pc:var(--d-evoke);--pr:var(--rgb-evoke)}.p-evolve{--pc:var(--d-evolve);--pr:var(--rgb-evolve)}
.p-equil{--pc:var(--d-equil);--pr:var(--rgb-equil)}.p-broad{--pc:var(--d-broad);--pr:var(--rgb-broad)}.p-home{--pc:var(--d-home);--pr:var(--rgb-home)}
.pcard{border-left:6px solid var(--pc);background:linear-gradient(90deg,rgba(var(--pr),var(--tint)),var(--panel) 60%)}
.mk{flex:none;display:inline-block;vertical-align:middle;width:13px;height:13px;color:var(--pc);fill:currentColor;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}
.mk.lg{width:20px;height:20px}.mk.xl{width:26px;height:26px}
.chip.link{color:var(--purple-t);background:var(--purple-b);font-size:10.5px;padding:2px 8px}
.chip.link svg{width:11px;height:11px}
.chip.pinned{color:var(--accent);background:var(--raised);border:1px solid var(--accent);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:1px 8px}

/* ---------------- ranking (Auto top 3) ---------------- */
function tierOf(it){
  var rs=state.priorities.rules.filter(function(r){return r.enabled&&(r.key==='blocked'||r.key==='dated')});
  for(var i=0;i<rs.length;i++){
    if(rs[i].key==='blocked'&&it.status==='blocked')return i;
    if(rs[i].key==='dated'){var d=daysTo(it);if(d!==null&&d<=(rs[i].days==null?3:rs[i].days))return i}
  }
  return 99;
}
var PRI={high:0,med:1,low:2};
function priOf(it){return it.priority in PRI?PRI[it.priority]:1}
function cmpRank(a,b){
  var ta=tierOf(a),tb=tierOf(b);if(ta!==tb)return ta-tb;
  var pa=priOf(a),pb=priOf(b);if(pa!==pb)return pa-pb;
  var da=daysTo(a),db=daysTo(b);if(da!==db){if(da===null)return 1;if(db===null)return -1;return da-db}
  var la=laneRank(a.lane),lb=laneRank(b.lane);if(la!==lb)return la-lb;
  return a.created_at<b.created_at?-1:a.created_at>b.created_at?1:0;
}
function whyText(it){
  var t=tierOf(it),rs=state.priorities.rules.filter(function(r){return r.enabled&&(r.key==='blocked'||r.key==='dated')});
  if(t<99){var r=rs[t];return r.key==='blocked'?'blocked · beats everything':'dated within '+(r.days==null?3:r.days)+' days'}
  var a=waitAge(it);if(a!==null&&a>=waitDays())return 'waiting '+waitDays()+'+ days';
  return it.priority?('priority '+it.priority+' · then due date, lane order'):'ranked by lane order';
}
function nextDecision(){
  var f=focusLane();
  var l=state.items.filter(function(i){return i.kind==='decision'&&isOpen(i)&&(!f||i.lane===f)&&laneById(i.lane)});
  l.sort(function(a,b){var da=daysTo(a),db=daysTo(b);if(da!==db){if(da===null)return 1;if(db===null)return -1;return da-db}return cmpRank(a,b)});
  return l[0]||null;
}
function top3(){
  var f=focusLane(),hero=nextDecision();
  var pool=state.items.filter(function(i){return isOpen(i)&&laneById(i.lane)&&(!f||i.lane===f)});
  var pinned=pool.filter(function(i){return i.pinned}).sort(function(a,b){return (a.pinned_at||'')<(b.pinned_at||'')?-1:1});
  var rest=pool.filter(function(i){return !i.pinned&&!(hero&&i.id===hero.id)}).sort(cmpRank);
  var out=pinned.slice(0,3).map(function(i){return {it:i,pinned:true}});
  var picks=[],seen={};out.forEach(function(o){seen[o.it.lane]=1});
  rest.forEach(function(i){if(out.length+picks.length<3&&!seen[i.lane]){picks.push(i);seen[i.lane]=1}});
  rest.forEach(function(i){if(out.length+picks.length<3&&picks.indexOf(i)<0)picks.push(i)});
  picks.sort(cmpRank);
  picks.forEach(function(i){out.push({it:i,pinned:false})});
  return out;
}

function waitRows(){

function cmpDue(a,b){var da=daysTo(a),db=daysTo(b);if(da!==db){if(da===null)return 1;if(db===null)return -1;return da-db}return a.created_at<b.created_at?-1:1}

function lanesSections(filterFn,sortFn,emptyMsg,opts){

/* ---------------- Bots ---------------- */
function isQuiet(b){
  if(b.last_note==='none recorded')return true;
  if(!b.last_activity_at)return false;
  return dayDiff(b.last_activity_at.slice(0,10),today())>=7;
}
function lastActivity(b){
  if(!b.last_activity_at)return b.last_note==='none recorded'?'none recorded':'unknown';
  var d=b.last_activity_at,t=d.length>10?d.slice(11,16):null,s=dshort(d.slice(0,10));
  if(t){var h=+t.slice(0,2);s+=' · '+(h%12||12)+':'+t.slice(3)+' '+(h<12?'AM':'PM')}
  return s;
}
function botRows(b){
  var rows=[],used={};
  b.snapshot.forEach(function(s){
    var it=s.item_id?itemById(s.item_id):null;
    if(s.item_id&&!it)return;
    if(it)used[it.id]=1;
    rows.push({status:it?it.status:s.status,text:it?it.title:s.text,date:it&&it.due?dshort(it.due):s.date,link:it?(it.link?linkLabel(it.link):s.link):s.link,id:it?it.id:null});
  });
  state.items.forEach(function(it){if(it.bot===b.id&&isOpen(it)&&!used[it.id])rows.push({status:it.status,text:it.title,date:it.due?dshort(it.due):'',link:it.link?linkLabel(it.link):null,id:it.id})});
  rows.sort(function(a,b2){return (CLOSED.indexOf(a.status)>=0?1:0)-(CLOSED.indexOf(b2.status)>=0?1:0)});
  return rows;
}
function repChips(b){
  var r=(b.reports_to||[]);if(!r.length)return '';
  return r.map(function(n){var o=state.bots.filter(function(x){return x.name===n||x.source_name===n})[0];return o?bchip(o):'<span class="bchip plain">'+esc(n)+'</span>'}).join(' ');
}
function sendBtn(b,small){
  return '<button class="btn sendb'+(small?' sm':'')+'" data-act="send" data-bot="'+esc(b.id)+'">'+svg('send','s')+'Send request to bot</button>';
}
function botCard(b){
  var q=isQuiet(b),rows=botRows(b),more=Math.max(0,rows.length-3)+(b.more_sample||0);
  var lane=b.lane?laneById(b.lane):null;
  var cls='card bc'+(q?' q':'')+(lane?' pcard '+pcls(lane.id):'');
  var h='<article class="'+cls+'" data-bot="'+esc(b.id)+'"><div class="hd">'+bbadge(b,'lg')+'<div style="min-width:0"><div class="nm">'+esc(b.name)+'</div>'+(q?'':'<div class="la">Last activity <b>'+esc(lastActivity(b))+'</b></div>')+'</div></div>';
  if(b.job)h+='<div class="job">'+esc(b.job)+'</div>';
  if(q)h+='<div class="stale">'+(b.last_activity_at?'No activity in 7 days \u00b7 last '+esc(dshort(b.last_activity_at.slice(0,10))):'No transcript recorded')+'</div>';
  rows.slice(0,3).forEach(function(r){var st=STATUS[r.status]||STATUS.open;
    h+='<div class="bi"><div class="r1"><span class="chip xs '+st[0]+'">'+st[1]+'</span><span class="dt">'+esc(r.date||'')+'</span></div><div class="tx">'+botify(r.text)+'</div>'+(r.link?'<div class="lnk">'+svg('link','s')+'Linked: '+esc(r.link)+'</div>':'')+'</div>';
  });
  if(!rows.length)h+='<div class="bi"><div class="tx" style="color:var(--muted)">Nothing open.</div></div>';
  h+='<div class="ft"><div class="rep">Reports to '+repChips(b)+(more?' \u00b7 <b>+'+more+' more open</b>':'')+'</div>'+sendBtn(b)+'</div></article>';
  return h;
}
function compactCard(b){
  var q=isQuiet(b),rows=botRows(b),lane=b.lane?laneById(b.lane):null;
  var first=rows.length?rows[0].text:'Nothing open';
  var h='<article class="card bc cc'+(q?' q':'')+(lane?' pcard '+pcls(lane.id):'')+'" data-bot="'+esc(b.id)+'"><div class="hd">'+bbadge(b,'md')+'<div class="nm">'+esc(b.name)+'</div></div>';
  h+=q?'<div class="stale">'+(b.last_activity_at?'No activity in 7 days':'No transcript recorded')+'</div>':'<div class="dt">'+esc(lastActivity(b))+'</div>';
  h+='<div class="tx cx">'+botify(first)+'</div>'+sendBtn(b,true)+'</article>';
  return h;
}
function botsHTML(){
  var vis=state.bots.filter(function(b){return !b.hidden});
  var html='<div class="bwrap">';
  var groups=state.lanes.map(function(l){return {id:l.id,lane:l,bots:vis.filter(function(b){return b.lane===l.id})}});
  var known=laneIds(state);
  groups.push({id:'cross',lane:null,bots:vis.filter(function(b){return known.indexOf(b.lane)<0})});
  groups.forEach(function(g){
    if(!g.bots.length&&g.lane===null)return;
    var open=ui.openLanes[g.id]===true;
    var name=g.lane?g.lane.name:'Cross-project',sub=g.lane?(g.lane.desc||''):'Builders and relay';
    var lm=g.lane?mark(g.lane,'xl'):'<span class="mk xl cross">'+svg('bots','s')+'</span>';
    var cnt=g.bots.length+' bot'+(g.bots.length===1?'':'s');
    if(!open){
      var chips=g.bots.map(function(b){return '<span class="b" style="--bc:'+botColor(b)+';border-color:color-mix(in srgb,var(--bc) 55%,transparent)">'+bbadge(b)+esc(b.name)+'<i>'+esc(lastActivity(b).split(' \u00b7 ')[0])+'</i></span>'}).join('');
      html+='<button class="card coll '+(g.lane?'pcard '+pcls(g.id):'')+'" data-act="lane-toggle" data-v="'+esc(g.id)+'" aria-expanded="false">'+lm+'<span class="nm">'+esc(name)+'</span><span class="cnt">'+cnt+'</span><div class="bots">'+chips+'</div><span class="caret">'+svg('arrow','s')+'</span></button>';
      return;
    }
    var full=g.bots.filter(function(b){return !isQuiet(b)&&!b.compact}),small=g.bots.filter(function(b){return isQuiet(b)||b.compact});
    html+='<section class="lane"><button class="lh '+(g.lane?pcls(g.id):'')+'" data-act="lane-toggle" data-v="'+esc(g.id)+'" aria-expanded="true">'+lm+'<span class="nm">'+esc(name)+'</span><span class="cnt">'+cnt+'</span><span class="ct">'+esc(sub)+'</span><span class="line"></span><span class="chev o">'+svg('down','s')+'</span></button>';
    if(!g.bots.length)html+='<div class="empty">No bots in this lane.</div>';
    html+='<div class="cards">'+full.map(botCard).join('')+'</div>';
    if(small.length){var nq=small.filter(isQuiet).length;html+='<div class="kick qk">Also in '+esc(name)+(nq?' \u00b7 '+nq+' quiet 7+ days':'')+'</div><div class="crow">'+small.map(compactCard).join('')+'</div>'}

  });
  return html+'</div>';
}

function copyText(text,done){
  function ok(){done&&done(true)}
  function legacy(){
    var ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;left:0;top:0;width:1px;height:1px;opacity:0';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,text.length);
    var r=false;try{r=document.execCommand('copy')}catch(e){}
    document.body.removeChild(ta);
    if(r)ok();else manual();
  }
  function manual(){
    var host=$('#dlgHost');
    var box=document.createElement('div');box.className='scrim';box.setAttribute('data-act','dlg-scrim');
    box.innerHTML='<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="mcTitle"><div class="kick">Copy by hand</div><h2 id="mcTitle" class="disp">Your browser blocked automatic copy</h2><p class="note">The text is selected below. Press Ctrl+C (Cmd+C on Mac), then close this.</p><textarea class="fi" id="manualCopy" rows="8" readonly></textarea><div class="dacts"><span class="grow"></span><button class="btn primary" data-act="mc-close">Done</button></div></div>';
    host.appendChild(box);
    var ta=$('#manualCopy');ta.value=text;ta.focus();ta.select();
    done&&done('manual');
  }
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(ok,legacy)}else legacy();
}
function toast(msg){

/* ---------------- export / import ---------------- */
function exportObj(){return JSON.parse(JSON.stringify(state))}
function exportJSON(){return JSON.stringify(exportObj(),null,2)}
function downloadJSON(){
  var txt=exportJSON(),name='command-center-'+today()+'.json';
  try{
    var blob=new Blob([txt],{type:'application/json'}),a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);toast('Exported '+name);
  }catch(e){copyText(txt,function(){toast('Download blocked; JSON copied instead')})}
}
function importText(txt,quiet){
  var o;
  try{o=JSON.parse(txt)}catch(e){toast('That is not valid JSON');return false}
  try{o=normalize(o)}catch(e){toast(e.message);return false}
  function go(){state=o;ui.focus='all';ui.capLane=null;applyTheme();adapter.save(state);closeDialog();render();toast('Imported '+o.items.length+' items')}
  if(quiet){go();return true}
  confirmDialog('Replace everything?','Importing replaces the current lanes, items, bots, outbox and notes on this device with '+o.items.length+' items from the file. Export first if you want a backup.','Import',go,true);
  return true;
}

/* ---------------- GitHub sync (storage adapter that sits beside localStorage) ----------------
   localStorage stays the always-on offline cache. When a fine-grained token is saved on THIS device
   (Settings > Sync), changes are also pushed to one JSON file in a private GitHub repo through the
   contents API (api.github.com, CORS allowed), and the file is pulled on start / focus / every minute.
   The token lives only in localStorage key "cc.sync.v1" on this device. It is never in the code,
   never in the exported JSON, never in the data file. */
var localAdapter=adapter;
var SYNC_KEY='cc.sync.v1',SYNC_BASE_KEY='cc.sync.base.v1';
var sync=(function(){
  var API='https://api.github.com';
  var DEF={owner:'cosmopaxus',repo:'command-center-data',path:'data/command-center.json'};
  var COLL=['lanes','bots','items','outbox','notes'];
  var S={status:'local',msg:'',busy:false,again:false,timer:null,ver:0,repoOk:false,pendingRender:false,draft:{},lastTest:'',started:false};
  var cfg=readCfg();
  function readCfg(){try{var c=JSON.parse(localStorage.getItem(SYNC_KEY)||'null');if(c&&typeof c==='object')return c}catch(e){}return {}}
  function writeCfg(){try{localStorage.setItem(SYNC_KEY,JSON.stringify(cfg))}catch(e){}}
  function readBase(){try{var t=localStorage.getItem(SYNC_BASE_KEY);return t?JSON.parse(t):null}catch(e){return null}}
  function writeBase(t){try{localStorage.setItem(SYNC_BASE_KEY,t)}catch(e){}}
  function owner(){return cfg.owner||DEF.owner}
  function repo(){return cfg.repo||DEF.repo}
  function path(){return cfg.path||DEF.path}
  function connected(){return !!cfg.token}
  function fullName(){return owner()+'/'+repo()}
  function cur(){return {owner:owner(),repo:repo(),path:path(),token:cfg.token}}

  /* ----- helpers ----- */
  function b64ToText(b){var bin=atob(String(b).replace(/\s/g,'')),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder('utf-8').decode(u)}
  function textToB64(t){var u=new TextEncoder().encode(t),s='';for(var i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
  function mkErr(kind,msg){var e=new Error(msg);e.kind=kind;return e}
  function ts(r){var t=r&&r.updated_at?Date.parse(r.updated_at):0;return isNaN(t)?0:t}
  function eq(a,b){return JSON.stringify(a)===JSON.stringify(b)}
  function byId(a){var m={};(a||[]).forEach(function(r){if(r&&r.id)m[r.id]=r});return m}
  function clone(o){return JSON.parse(JSON.stringify(o))}

  /* ----- GitHub REST ----- */
  async function gh(method,url,body,accept,c){
    var h={'Accept':accept||'application/vnd.github+json','Authorization':'Bearer '+(c||cur()).token};
    if(body)h['Content-Type']='application/json';
    var r;
    try{r=await fetch(API+url,{method:method,headers:h,body:body?JSON.stringify(body):undefined,cache:'no-cache'})}
    catch(e){throw mkErr('offline','Cannot reach GitHub. You are offline or GitHub is blocked. Changes are kept on this device and will sync when you are back online.')}
    return r;
  }
  async function httpFail(r,what,c){
    var m='';try{var j=await r.json();m=j&&j.message?String(j.message):''}catch(e){}
    c=c||cur();var rn=c.owner+'/'+c.repo;
    if(r.status===401)return mkErr('auth','GitHub rejected the token (bad, expired or revoked). Create a new one and paste it in Settings > Sync.');
    if(r.status===403){
      if(r.headers.get('x-ratelimit-remaining')==='0'||/rate limit/i.test(m))return mkErr('rate','GitHub rate limit reached. It will retry in a few minutes.');
      return mkErr('perm','The token is not allowed to '+(what||'do that')+' on '+rn+'. It needs Contents: Read and write for this repository.');
    }
    if(r.status===404)return mkErr('notfound','Repository '+rn+' was not found, or the token has no access to it. Check the owner and repo name, and that the token lists this repository.');
    if(r.status===409||r.status===422)return mkErr('conflict',m||'Conflict');
    return mkErr('http','GitHub answered '+r.status+(m?' ('+m+')':'')+'.');
  }
  async function checkRepo(c){
    c=c||cur();var fn=c.owner+'/'+c.repo;
    var r=await gh('GET','/repos/'+encodeURIComponent(c.owner)+'/'+encodeURIComponent(c.repo),null,null,c);
    if(!r.ok)throw await httpFail(r,'read',c);
    var j=await r.json();
    if(j.private===false)throw mkErr('public','Repository '+fn+' is public. Command Center only syncs to a PRIVATE repo so your data is not exposed. Nothing was sent.');
    if(j.permissions&&j.permissions.push===false)throw mkErr('perm','The token can read '+fn+' but not write. Set Contents to Read and write on the token.');
    if(c===undefined||!c._probe)S.repoOk=true;return j;
  }
  function fileUrl(c){c=c||cur();return '/repos/'+encodeURIComponent(c.owner)+'/'+encodeURIComponent(c.repo)+'/contents/'+c.path.split('/').map(encodeURIComponent).join('/')}
  async function pull(c){
    c=c||cur();
    var r=await gh('GET',fileUrl(c),null,null,c);
    if(r.status===404){if(c._probe||!S.repoOk)await checkRepo(c);return {exists:false}}
    if(!r.ok)throw await httpFail(r,'read',c);
    var j=await r.json(),text;
    if(j.content&&j.encoding==='base64')text=b64ToText(j.content);
    else{var r2=await gh('GET',fileUrl(c),null,'application/vnd.github.raw+json',c);if(!r2.ok)throw await httpFail(r2,'read',c);text=await r2.text()}
    return {exists:true,sha:j.sha,text:text};
  }
  function parseRemote(text){
    var o;
    try{o=JSON.parse(text)}catch(e){throw mkErr('badfile','The data file '+path()+' is not valid JSON, so nothing was changed. Fix or restore the file in GitHub.')}
    if(!o||o.format!=='command-center/v1')throw mkErr('badfile','The data file '+path()+' is not a command-center/v1 file, so nothing was changed.');
    try{return normalize(o)}catch(e){throw mkErr('badfile','The data file '+path()+' cannot be read: '+e.message)}
  }
  async function push(text,sha){
    var body={message:'Command Center sync '+nowIso().slice(0,16).replace('T',' ')+'Z',content:textToB64(text)};
    if(sha)body.sha=sha;
    var r=await gh('PUT',fileUrl(),body);
    if(r.status===409||r.status===422)return {conflict:true};
    if(!r.ok)throw await httpFail(r,'write');
    var j=await r.json();
    return {ok:true,sha:j&&j.content&&j.content.sha};
  }

  /* ----- merge: by item id, updated_at newest wins, deletions only when the other side knew the row (base) ----- */
  function pick(l,r,b,st){
    if(l&&r){
      if(!b&&l.sample&&!r.sample)return r;           /* untouched example row loses to real remote row */
      if(!b&&l.sample&&r.sample)return r;
      if(eq(l,r))return r;
      if(ts(l)>ts(r)){st.local++;return l}
      st.remote++;return r;
    }
    if(l){ /* only local */
      if(b)return ts(l)>ts(b)?l:null;                /* remote deleted it: keep only if edited here since */
      return l.sample?null:l;                        /* never synced: drop untouched examples, keep my own rows */
    }
    if(r){ /* only remote */
      if(b){return ts(r)>ts(b)?r:null}              /* I deleted it: keep only if the other side edited it since */
      return r;
    }
    return null;
  }
  function mergeStates(L,R,B,hasBase){
    var out=clone(R),st={local:0,remote:0};
    COLL.forEach(function(k){
      var lm=byId(L[k]),rm=byId(R[k]),bm=hasBase&&B?byId(B[k]):null,res=[],seen={};
      (R[k]||[]).forEach(function(r){seen[r.id]=1;var x=pick(lm[r.id],r,bm?bm[r.id]:null,st);if(x)res.push(x)});
      (L[k]||[]).forEach(function(l){if(seen[l.id])return;var x=pick(l,null,bm?bm[l.id]:null,st);if(x)res.push(x)});
      out[k]=clone(res);
    });
    /* never leave an item pointing at a missing lane */
    var have=byId(out.lanes);
    out.items.forEach(function(it){if(!have[it.lane]){var src=byId(L.lanes)[it.lane]||byId(R.lanes)[it.lane]||(B?byId(B.lanes)[it.lane]:null);if(src){out.lanes.push(clone(src));have[src.id]=src}}});
    /* top-level config: the side edited last wins; theme is a per-device choice */
    var lm0=Date.parse(L.meta&&L.meta.updated_at)||0,rm0=Date.parse(R.meta&&R.meta.updated_at)||0;
    var useLocal=hasBase?lm0>rm0:(!L.meta.sample&&lm0>rm0);
    if(useLocal){out.priorities=clone(L.priorities);out.settings=clone(L.settings);out.meta=clone(L.meta);}
    out.meta.sample=['items','notes','outbox'].some(function(k){return out[k].some(function(r){return r.sample===true})});
    out.settings=out.settings||{};out.settings.theme=(L.settings&&L.settings.theme)||'dark';
    out.meta.updated_at=new Date(Math.max(lm0,rm0)||Date.now()).toISOString();
    return {state:normalize(out),stats:st};
  }

  /* ----- status ----- */
  var LABEL={local:'Local only',synced:'Synced',saving:'Saving…',syncing:'Syncing…',offline:'Offline',error:'Sync error'};
  function ago(t){if(!t)return 'never';var s=Math.round((Date.now()-t)/1000);if(s<10)return 'just now';if(s<90)return s+' s ago';if(s<5400)return Math.round(s/60)+' min ago';return new Date(t).toLocaleString()}
  function setStatus(s,msg){
    S.status=s;if(msg!==undefined)S.msg=msg;

  function chipTitle(){

    if(S.status==='error')return S.msg;
    if(S.status==='offline')return 'Offline. Saved on this device; will sync when GitHub is reachable.';
    return fullName()+' · last synced '+ago(cfg.lastSyncAt);
  }
  function lineText(){
    if(S.lastTest&&Date.now()-S.lastTestAt<15000)return S.lastTest;
    if(S.status==='local')return 'Not connected. Everything is stored only on this device.';
    var base=LABEL[S.status]+' · '+fullName()+' / '+path()+(cfg.lastSyncAt?' · last synced '+ago(cfg.lastSyncAt):'')+(cfg.sha?' · file '+String(cfg.sha).slice(0,7):'');

  }
  function chipHTML(){
    return '<button class="syncchip sc-'+S.status+'" data-act="sync-chip" title="'+esc(chipTitle())+'" aria-label="Sync status: '+LABEL[S.status]+'"><i class="scd"></i><span class="sct">'+LABEL[S.status]+'</span></button>';

  function safeRender(){

  document.addEventListener('focusout',function(){if(!S.pendingRender)return;setTimeout(function(){var a=document.activeElement;if(S.pendingRender&&!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))&&!dlgEl){S.pendingRender=false;render()}},60)});

  /* ----- the sync cycle ----- */
  function adopt(next){
    var before=JSON.stringify(state);
    state=next;ui.focus=laneById(ui.focus)?ui.focus:'all';
    localAdapter.save(state);

  }
  async function cycle(manual){
    if(!S.repoOk)await checkRepo();
    S.lastMerge='';
    var tries=0,merged=null;
    for(;;){
      if(cfg.dirty&&cfg.sha&&tries===0&&!manual){
        var v0=S.ver,t0=JSON.stringify(state,null,1),p0=await push(t0,cfg.sha);
        if(p0.ok){cfg.sha=p0.sha;writeBase(t0);if(S.ver===v0)cfg.dirty=false;break}
        tries++;
      }
      var rem=await pull();
      if(!rem.exists){
        var v1=S.ver,t1=JSON.stringify(state,null,1),p1=await push(t1);
        if(p1.conflict){tries++;if(tries>4)throw mkErr('conflict','Could not save: the file keeps changing on GitHub. Try Sync now again.');continue}
        cfg.sha=p1.sha;writeBase(t1);if(S.ver===v1)cfg.dirty=false;break;
      }
      if(rem.sha!==cfg.sha){
        var R=parseRemote(rem.text),hasBase=!!(cfg.sha&&readBase()),B=hasBase?readBase():null;
        var m=mergeStates(state,R,B,hasBase);
        merged=m.stats;
        var changedLocal=!eq(stripMeta(m.state),stripMeta(state)),needPush=!eq(stripMeta(m.state),stripMeta(R));
        if(changedLocal)adopt(m.state);
        cfg.sha=rem.sha;writeBase(rem.text);
        if(needPush)cfg.dirty=true;
        S.lastMerge=(m.stats.local||m.stats.remote)?('Merged: kept '+m.stats.remote+' newer remote and '+m.stats.local+' newer local change(s)'):'';
      }
      if(!cfg.dirty)break;
      var v2=S.ver,t2=JSON.stringify(state,null,1),p2=await push(t2,cfg.sha);
      if(p2.ok){cfg.sha=p2.sha;writeBase(t2);if(S.ver===v2)cfg.dirty=false;break}
      tries++;if(tries>4)throw mkErr('conflict','Could not save: the file keeps changing on GitHub. Try Sync now again.');
    }

  }
  function stripMeta(s){var c=clone(s);if(c.meta)delete c.meta.updated_at;if(c.settings)delete c.settings.theme;return c}
  async function run(manual){
    if(!connected()){setStatus('local','');return}
    if(S.busy){S.again=true;return}
    if(typeof navigator!=='undefined'&&navigator.onLine===false){setStatus('offline','You are offline. Changes are saved on this device and will sync later.');return}
    S.busy=true;clearTimeout(S.timer);
    setStatus(cfg.dirty?'saving':'syncing');
    try{
      await cycle(manual);
      writeCfg();
      setStatus(cfg.dirty?'saving':'synced','');
      if(S.lastMerge&&manual)toast(S.lastMerge);
    }catch(e){
      writeCfg();
      var k=e&&e.kind;
      if(k==='offline')setStatus('offline',e.message);
      else if(k==='rate'){setStatus('error',e.message);scheduleRetry(300000)}
      else setStatus('error',(e&&e.message)||'Sync failed.');
      if(k==='offline')scheduleRetry(30000);

  function scheduleRetry(ms){clearTimeout(S.retry);S.retry=setTimeout(function(){if(connected()&&(cfg.dirty||S.status==='offline'))run()},ms)}
  function schedule(ms){clearTimeout(S.timer);S.timer=setTimeout(function(){run()},ms==null?2000:ms)}
  function changed(){
    if(!connected())return;
    cfg.dirty=true;S.ver++;writeCfg();
    setStatus('saving');
    schedule(2000);
  }

  /* ----- settings actions ----- */
  function readFields(){
    var o=($('#syncOwner')||{}).value,r=($('#syncRepo')||{}).value,t=($('#syncTok')||{}).value;
    return {owner:(o!=null?o:S.draft.owner||owner()).trim(),repo:(r!=null?r:S.draft.repo||repo()).trim().replace(/\.git$/,''),token:(t!=null?t:S.draft.token||'').trim()};
  }
  function note(msg){S.lastTest=msg;S.lastTestAt=Date.now();var l=$('#syncLine');if(l)l.textContent=msg}
  async function test(){
    var f=readFields(),tok=f.token||cfg.token;
    if(!tok){note('Paste a token first, then press Test connection.');return}
    var c={owner:f.owner||DEF.owner,repo:f.repo||DEF.repo,path:path(),token:tok,_probe:true};
    note('Testing…');
    try{
      await checkRepo(c);
      var p=await pull(c),msg;
      if(p.exists){var R=parseRemote(p.text);msg='Connected to '+c.owner+'/'+c.repo+'. Data file found: '+R.items.length+' items'+(R.meta.sample?' (example data)':'')+'. Token can read and write.'}
      else msg='Connected to '+c.owner+'/'+c.repo+'. The data file '+c.path+' does not exist yet; it will be created when you press Save & connect.';
      note('✓ '+msg);return {ok:true,msg:msg};
    }catch(e){note('✗ '+e.message);return {ok:false,msg:e.message}}
  }
  async function saveConnect(){
    var f=readFields();
    if(!f.owner||!f.repo){note('Enter the repo owner and name.');return}
    var tok=f.token||cfg.token;
    if(!tok){note('Paste a fine-grained token first.');return}
    var changedRepo=f.owner!==cfg.owner||f.repo!==cfg.repo||(f.token&&f.token!==cfg.token);
    var prev=clone(cfg);
    cfg.owner=f.owner;cfg.repo=f.repo;cfg.token=tok;cfg.path=cfg.path||DEF.path;
    if(changedRepo){cfg.sha=null;cfg.dirty=false;try{localStorage.removeItem(SYNC_BASE_KEY)}catch(e){}S.repoOk=false}
    S.draft={};

  /* ----- lifecycle ----- */
  function start(){
    if(S.started)return;S.started=true;

    if(!f.title.value.trim())return;
    if(!n){n=row({id:uid('nt'),sample:false});state.notes.push(n)}
    n.title=f.title.value.trim();n.url=f.url.value.trim();n.text=f.text.value.trim();n.lane=f.lane.value||null;touch(n);closeDialog();commit();
  }else if(k==='send')saveOutbox();
});
/* live (typing) handlers: update state without a full re-render so focus is kept */
document.addEventListener('input',function(e){
  var el=e.target,k=el.getAttribute&&el.getAttribute('data-input'),lv=el.getAttribute&&el.getAttribute('data-live');
  if(lv==='libq'){ui.q=el.value;render();return}
  if(!k)return;
  if(k==='send-text'){updateSend();return}
  if(k==='sync-owner'){sync.draft('owner',el.value);return}
  if(k==='sync-repo'){sync.draft('repo',el.value);return}
  if(k==='sync-token'){sync.draft('token',el.value);return}
  if(k==='rule-title'){rule(el.dataset.key).title=el.value;commit(true)}
  else if(k==='rule-desc'){rule(el.dataset.key).desc=el.value;commit(true)}
  else if(k==='rule-days'){var v=Math.max(1,Math.min(60,parseInt(el.value,10)||0));if(v){rule(el.dataset.key).days=v;commit(true)}}
  else if(k==='lane-name'){var l=laneById(el.dataset.id);l.name=el.value||'Untitled';touch(l);commit(true)}
  else if(k==='mark-val'){var l2=laneById(el.dataset.id);l2.mark.value=l2.mark.type==='letter'?el.value.slice(0,1):el.value;touch(l2);commit(true)}
});
document.addEventListener('change',function(e){
  var el=e.target,k=el.getAttribute&&el.getAttribute('data-change'),ik=el.getAttribute&&el.getAttribute('data-input');
  if(k==='caplane'){ui.capLane=el.value;render();return}
  if(k==='send-bot'){updateSend();return}
  if(k==='item-status'){var w=$('#sinceWrap');if(w)w.hidden=WAITING.indexOf(el.value)<0;return}
  if(k==='item-lane'||k==='item-linklane'){
    var form=el.form,ll=form.elements.linklane.value;
    form.elements.linkitem.innerHTML=ll?linkItemOpts(ll,null,form.getAttribute('data-id')):'<option value="">(whole lane)</option>';return}
  if(k==='lane-shape'){var l=laneById(el.dataset.id);l.shape=el.value;touch(l);commit();return}
  if(k==='import-file'){
    var f=el.files&&el.files[0];if(!f)return;
    var r=new FileReader();r.onload=function(){importText(String(r.result),ui.quietImport)};r.onerror=function(){toast('Could not read that file')};r.readAsText(f);el.value='';return}
  if(ik==='lane-color'||ik==='lane-color-light'){var l3=laneById(el.dataset.id);if(ik==='lane-color')l3.color=el.value;else l3.color_light=el.value;touch(l3);commit();return}
  if(ik==='rule-title'||ik==='rule-desc'||ik==='rule-days'||ik==='lane-name'||ik==='mark-val'){render()}
});
/* drag to reorder lanes */
function wireDrag(){
  $$('.lr[draggable]').forEach(function(r){
    r.addEventListener('dragstart',function(e){ui.dragId=r.getAttribute('data-lane');r.classList.add('drag');try{e.dataTransfer.setData('text/plain',ui.dragId);e.dataTransfer.effectAllowed='move'}catch(x){}});
    r.addEventListener('dragend',function(){ui.dragId=null;$$('.lr').forEach(function(x){x.classList.remove('drag','over')})});
    r.addEventListener('dragover',function(e){if(!ui.dragId)return;e.preventDefault();$$('.lr').forEach(function(x){x.classList.remove('over')});r.classList.add('over')});
    r.addEventListener('drop',function(e){
      e.preventDefault();if(!ui.dragId)return;
      var a=state.priorities.lane_order,from=a.indexOf(ui.dragId),to=a.indexOf(r.getAttribute('data-lane'));
      ui.dragId=null;if(from<0||to<0||from===to)return;moveIn(a,from,to);commit();
    });
  });
}

/* ---------------- init ---------------- */
function init(){
  var saved=null;try{saved=adapter.load()}catch(e){saved=null}
  try{state=saved?normalize(saved):normalize(makeSeed())}catch(e){state=normalize(makeSeed())}
  if(!saved)adapter.save(state);
  /* theme: stored state wins; fall back to the early-script key */
  applyTheme();
  window.addEventListener('hashchange',route);
  route();
  sync.start();
  window.CC=window.__cc={get state(){return state},adapter:adapter,render:render,top3:top3,exportJSON:exportJSON,sync:sync,importText:importText,openSend:sendDialog,today:today,ui:ui,go:go,teamVisible:teamVisible};
}
init();
})();

</script>
